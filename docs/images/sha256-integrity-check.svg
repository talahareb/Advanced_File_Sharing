<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-label="File bytes transfer without encryption over TCP; sender and receiver independently calculate SHA-256 checksums, compare digests, and detect possible corruption without confidentiality or authentication">
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M1 1L8 5L1 9" fill="none" stroke="#4E6D86" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#233B50}.title{font-size:28px;font-weight:700}.head{font-size:25px;font-weight:700}.line{fill:none;stroke:#6489AC;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.body{font-size:18px}.note{font-size:16px;fill:#607689}</style></defs>
<rect x="1.5" y="1.5" width="1097" height="497" rx="22" fill="#FCFDFE" stroke="#D8E2EB" stroke-width="2"/>
<text class="title" x="40" y="54">SHA-256 integrity checking</text>
<text class="note" x="40" y="82">Checksums help detect mismatched file contents; they do not encrypt network traffic</text>
<!-- sender -->
<rect x="40" y="117" width="325" height="158" rx="19" fill="#E3F0FC" stroke="#77A5D1" stroke-width="2.5"/>
<text class="head" x="202" y="165" text-anchor="middle">Sender</text>
<text class="body" x="202" y="201" text-anchor="middle">Reads file bytes</text>
<text class="body" x="202" y="230" text-anchor="middle">Computes SHA-256 digest</text>
<!-- receiver -->
<rect x="735" y="117" width="325" height="158" rx="19" fill="#E1F3E9" stroke="#68AE8C" stroke-width="2.5"/>
<text class="head" x="897" y="165" text-anchor="middle">Receiver</text>
<text class="body" x="897" y="201" text-anchor="middle">Receives file bytes</text>
<text class="body" x="897" y="230" text-anchor="middle">Computes SHA-256 digest</text>
<!-- TCP arrow -->
<path d="M366 166H732" fill="none" stroke="#405C72" stroke-width="3" marker-end="url(#arr)"/>
<rect x="443" y="120" width="212" height="37" rx="18" fill="#FFF3DD" stroke="#E7BF77"/>
<text x="549" y="145" text-anchor="middle" font-size="17" fill="#845D25">TCP · unencrypted</text>
<!-- hash compare -->
<path class="line" d="M202 277 V326 H472"/>
<path class="line" d="M897 277 V326 H625"/>
<rect x="454" y="304" width="191" height="75" rx="17" fill="#EFE9FA" stroke="#A892D9" stroke-width="2.5"/>
<text x="549" y="335" text-anchor="middle" font-size="21" font-weight="700">Compare</text>
<text x="549" y="362" text-anchor="middle" font-size="20" font-weight="600">digests</text>
<path d="M549 380V400" stroke="#655380" stroke-width="3"/>
<text x="549" y="428" text-anchor="middle" font-size="20" font-weight="700" fill="#31846B">Match → integrity check passes</text>
<text x="549" y="457" class="note" text-anchor="middle">Not proof of encryption, sender identity, or protection from an active attacker</text>
</svg>